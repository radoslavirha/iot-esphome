# Secrets pulled in as substitutions so they can be spliced into the token request
# body and both request URLs below — !secret can only be a whole node value, not
# combined with literal text inside a string.
substitutions:
  idp_token_url: !secret INTERACTIVE_MAP_IDP_TOKEN_URL
  idp_client_id: !secret INTERACTIVE_MAP_IDP_CLIENT_ID
  idp_client_secret: !secret INTERACTIVE_MAP_IDP_CLIENT_SECRET
  feeder_api_url: !secret INTERACTIVE_MAP_FEEDER_API_URL

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  name: iot-interactive-map
  friendly_name: Interactive Map
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    then:
      - light.turn_on:
          id: map
          brightness: 100%
          effect: "Border Chase"

# Enable logging
logger:
  level: DEBUG

api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret INTERACTIVE_MAP_WIFI_SSID
  password: !secret INTERACTIVE_MAP_WIFI_PASSWORD
  on_connect:
    then:
      - delay: 2s
      - script.execute: fetch_data

globals:
  - id: API_RESPONSE
    type: std::vector<std::array<int, 4>>
    restore_value: no
  - id: ACCESS_TOKEN
    type: std::string
    restore_value: no
    initial_value: '""'
  # Precomputed "Bearer <token>" string. request_headers lambdas must return `const char*`;
  # returning `.c_str()` from a temporary `std::string` built inline would dangle once the
  # temporary is destroyed, so the composed value is kept in this global instead, refreshed
  # every time ACCESS_TOKEN is (see request_token).
  - id: AUTH_HEADER_VALUE
    type: std::string
    restore_value: no
    initial_value: '""'
  # millis()-based deadline (with a safety margin baked in, see request_token). 0 means
  # "no token yet" and is also always in the past, so the first fetch_data call fetches one.
  - id: TOKEN_EXPIRES_AT
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Bounds the 401 retry in request_data to once per fetch_data call, so a wrong secret or
  # a down IdP can't cause an unbounded refresh-and-retry loop.
  - id: FETCH_RETRIED
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 10s
    then:
      - script.execute: fetch_data

http_request:
  id: http_client
  # Default buffer_size_tx (512 bytes, ESP32) is too small to build the request headers for
  # request_data: the feeder's JWT access_token measured 1340 bytes, so the "Authorization:
  # Bearer <token>" header alone is ~1350 bytes -- ESP-IDF's esp_http_client logs "Buffer
  # length is small to fit all the headers" and fails the request (status -1) when this is
  # exceeded. Sized with headroom above the measured ~1350 bytes for token/claim growth.
  buffer_size_tx: 4096

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO25
    num_leds: 72
    name: "Map"
    id: map
    default_transition_length: 
      seconds: 0
    effects:
      - addressable_lambda:
          name: "Cities from API"
          update_interval: 1s
          lambda: |-
            if (id(API_RESPONSE).empty()) {
              it.all() = Color::BLACK;
              return;
            }

            it.all() = Color::BLACK;
            for (const auto &city : id(API_RESPONSE)) {
              int led_index = city[0];
              int r = city[1];
              int g = city[2];
              int b = city[3];

              if (led_index < 0 || led_index >= it.size()) {
                continue;
              }
              it[led_index] = Color(r, g, b);
            }         
      - addressable_lambda:
          name: Border Chase
          update_interval: 200ms
          lambda: |-
            // W=>E north 24, 19, 16, 10,  9,  6,  3,  0,  4,  1,  2,  5,  7, 12, 21, 29, 31, 17, 25, 30, 36, 35
            // E=>W south 42, 56, 61, 65, 68, 71, 69, 64, 67, 70, 66, 60, 54, 50, 37
            static const std::vector<int> north_path = { 19, 16, 10,  6,  0,  4,  1,  2,  5,  7, 12, 21, 29, 31, 17, 25, 30, 36 };
            static const std::vector<int> south_path = { 35, 42, 44, 56, 61, 65, 68, 71, 69, 64, 67, 70, 66, 60, 54, 50, 37, 24 };
            static size_t north_pos = 0;
            static size_t south_pos = 0;

            it.all() = Color::BLACK;

            auto set_dot = [&](const std::vector<int> &path, size_t pos, Color color) {
              if (path.empty()) return;
              int idx = path[pos % path.size()];
              if (idx >= 0 && idx < it.size()) it[idx] = color;
            };

            set_dot(north_path, north_pos++, Color(0, 0, 255));
            set_dot(south_path, south_pos++, Color(255, 0, 0));

script:
  # Entry point (called from on_connect / the interval below). Reuses the cached token when
  # it's still valid, so a token is only requested roughly once per its ~10-minute lifetime
  # instead of on every 10s poll (Authentik writes to the service account row on every
  # client_credentials call).
  - id: fetch_data
    then:
      - lambda: |-
          id(FETCH_RETRIED) = false;
      - if:
          condition:
            lambda: |-
              return id(ACCESS_TOKEN).empty() || (int32_t)(millis() - id(TOKEN_EXPIRES_AT)) >= 0;
          then:
            - script.execute: request_token
          else:
            - script.execute: request_data

  - id: request_token
    # default mode (single) makes this script ignore re-entrant calls: the 401 retry below
    # calls this script from deep inside its own on_response -> request_data -> on_response
    # chain, while the original call is still synchronously on the stack, i.e. still
    # "running" from the script scheduler's point of view. `restart` stops the stale run and
    # starts a fresh one instead of silently dropping the retry.
    mode: restart
    then:
      - logger.log:
          level: INFO
          format: "Requesting new IdP access token"
      - http_request.post:
          url: ${idp_token_url}
          capture_response: true
          # Default is 1kB; the real token response measured 2660 bytes (long JWT access_token),
          # which was silently truncated -> ArduinoJson "IncompleteInput" -> ACCESS_TOKEN never
          # set -> request_data ran anyway with an empty Bearer token -> 401 from the feeder.
          # Sized with headroom above the measured ~2850 bytes (with scope claims) for growth.
          max_response_buffer_size: 8192
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          # scope is required: without it Authentik omits the `aud`/`roles` claims (the
          # feeder's trusted-issuer entry for this client checks both), so the token parses
          # and looks valid but the feeder still returns 401 "Authentication required".
          body: "grant_type=client_credentials&client_id=${idp_client_id}&client_secret=${idp_client_secret}&scope=openid%20profile%20email%20roles"
          on_response:
            - if:
                condition:
                  lambda: return response->status_code == 200;
                then:
                  - lambda: |-
                      json::parse_json(body, [&](JsonObject res) -> bool {
                        if (!res["access_token"] || !res["expires_in"]) {
                          ESP_LOGW("log", "Token response missing access_token/expires_in");
                          return false;
                        }

                        id(ACCESS_TOKEN) = res["access_token"].as<std::string>();
                        id(AUTH_HEADER_VALUE) = std::string("Bearer ") + id(ACCESS_TOKEN);
                        int expires_in = res["expires_in"].as<int>();
                        // 30s safety margin so the cached token is refreshed slightly before
                        // Authentik would actually reject it.
                        uint32_t margin_ms = expires_in > 30 ? (uint32_t)(expires_in - 30) * 1000 : 0;
                        id(TOKEN_EXPIRES_AT) = millis() + margin_ms;

                        ESP_LOGI("log", "Fetched new access token, expires in %ds", expires_in);
                        return true;
                      });
                  # Only proceed if the parse above actually populated a token. Without this
                  # gate, a truncated/malformed token response still fell through to request_data
                  # with an empty Bearer header, hitting the feeder with a doomed request.
                  - if:
                      condition:
                        lambda: return !id(ACCESS_TOKEN).empty();
                      then:
                        - script.execute: request_data
                      else:
                        - logger.log:
                            level: "WARN"
                            format: "Skipping data fetch: no valid access token"
                else:
                  - logger.log:
                      level: "WARN"
                      format: "Token request failed: status %d, message %s"
                      args: [ 'response->status_code', 'body.c_str()' ]
          on_error:
            then:
              - logger.log:
                  level: "WARN"
                  format: "Token request failed: connection error"

  - id: request_data
    then:
      - logger.log: 
          level: INFO
          format: "Fetching remote data"
      - http_request.get:
          url: ${feeder_api_url}/v1/data-sources/radar/cities/iot
          capture_response: true
          max_response_buffer_size: 15000
          request_headers:
            Content-Type: application/json
            # Important, without this body is empty. Related to Traefik.
            Accept-Encoding: identity
            Authorization: !lambda 'return id(AUTH_HEADER_VALUE).c_str();'
          on_response:
            - if:
                condition:
                  lambda: return response->status_code == 200;
                then:
                  - lambda: |-
                      json::parse_json(body, [&](JsonObject res) -> bool {
                        if (!res["cities"]) {
                          ESP_LOGI("log", "No 'cities' key in this json!");
                          return false;
                        }

                        JsonArray cities = res["cities"].as<JsonArray>();
                        if (cities.isNull()) {
                          ESP_LOGW("log", "'cities' key exists but is not an array");
                          return false;
                        }
                        ESP_LOGI("log", "Received %u cities", cities.size());

                        id(API_RESPONSE).clear();
                        id(API_RESPONSE).reserve(cities.size());

                        for (JsonObject city : cities) {
                          if (!city["id"].is<int>() || !city["color"] || !city["color"].is<JsonObject>()) {
                            ESP_LOGI("log", "City %u is invalid", city["id"].as<int>());
                            continue;
                          }

                          JsonObject color = city["color"].as<JsonObject>();
                          std::array<int, 4> entry = {
                            city["id"].as<int>(),
                            color["r"].as<int>(),
                            color["g"].as<int>(),
                            color["b"].as<int>()
                          };

                          id(API_RESPONSE).push_back(entry);
                        }

                        ESP_LOGI("log", "Stored %u cities in API_RESPONSE", id(API_RESPONSE).size());
                        return true;
                      });
                  - light.turn_on:
                      id: map
                      brightness: 100%
                      effect: "Cities from API"
                else:
                  - if:
                      # Token expired/revoked mid-cycle: force one refresh-and-retry. FETCH_RETRIED
                      # bounds this to a single retry per fetch_data call so a wrong secret or a
                      # down IdP can't turn into an unbounded loop.
                      condition:
                        lambda: return response->status_code == 401 && !id(FETCH_RETRIED);
                      then:
                        - logger.log:
                            level: "WARN"
                            format: "Feeder returned 401, refreshing token and retrying"
                        - lambda: |-
                            id(FETCH_RETRIED) = true;
                            id(ACCESS_TOKEN).clear();
                            id(AUTH_HEADER_VALUE).clear();
                            id(TOKEN_EXPIRES_AT) = 0;
                        - script.execute: request_token
                      else:
                        - logger.log:
                            level: "WARN"
                            format: "Error: Response status: %d, message %s"
                            args: [ 'response->status_code', 'body.c_str()' ]
          on_error:
            then:
              - logger.log:
                  level: "INFO"
                  format: "Request failed!"
