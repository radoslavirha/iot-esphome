    pin:
      mcp23xxx: mcp_1
      number: 12
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "relay_11"
    id: relay_11
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_1
      number: 5
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "relay_12"
    id: relay_12
    restore_mode: ALWAYS_OFF
