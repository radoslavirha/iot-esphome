  - platform: gpio
    name: "relay_18"
    id: relay_18
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_2
      number: 1
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "relay_19"
    id: relay_19
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_2
      number: 2
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "relay_20"
    id: relay_20
    restore_mode: ALWAYS_OFF
